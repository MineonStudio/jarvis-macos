name: Swift quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install static-analysis tools
        run: brew install swiftlint swiftformat

      - name: SwiftFormat check
        run: swiftformat --lint --config .swiftformat Sources Tests

      - name: SwiftLint check
        run: swiftlint lint --config .swiftlint.yml

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package app bundle
        run: ./build_app.sh

      - name: Check packaged identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Jarvis.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Jarvis.app/Contents/Info.plist
          test -f dist/Jarvis.app/Contents/Resources/Assets.car
          codesign -d --entitlements - dist/Jarvis.app >/dev/null

      - name: Check diff whitespace
        run: git diff --check

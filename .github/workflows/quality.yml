name: Swift quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install static-analysis tools
        run: |
          brew install swiftlint
          # macos-26 already has SwiftFormat 0.63.0 and brew install will not
          # replace it. 0.63.0 and 0.63.1 disagree on doc comments; this repo
          # is formatted with 0.63.1.
          curl -fsSL -o /tmp/swiftformat.zip -L https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.1/swiftformat.zip
          rm -rf /tmp/swiftformat-0.63.1
          mkdir -p /tmp/swiftformat-0.63.1
          unzip -o /tmp/swiftformat.zip -d /tmp/swiftformat-0.63.1
          chmod +x /tmp/swiftformat-0.63.1/swiftformat
          echo "/tmp/swiftformat-0.63.1" >> "$GITHUB_PATH"
          /tmp/swiftformat-0.63.1/swiftformat --version

      - name: SwiftFormat check
        run: |
          swiftformat --version
          test "$(swiftformat --version)" = "0.63.1"
          swiftformat --lint --config .swiftformat Sources Tests

      - name: SwiftLint check
        run: swiftlint lint --config .swiftlint.yml

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Package app bundle
        run: ./build_app.sh

      - name: Check packaged identity
        run: |
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Jarvis.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Jarvis.app/Contents/Info.plist
          test -f dist/Jarvis.app/Contents/Resources/Assets.car
          codesign -d --entitlements - dist/Jarvis.app >/dev/null

      - name: Check diff whitespace
        run: git diff --check
